          - generic [ref=e230]: 通知，以后晚间8点深度复盘，统一做成PDF，放在下载区，请自行下载查阅。今日份复盘，已经上传。
        - definition [ref=e234]:
          - generic [ref=e236]:
            - paragraph [ref=e238]: 李朋
            - generic [ref=e240]: 08:48
          - generic [ref=e241]:
            - paragraph [ref=e242]: 【明日思路】
            - paragraph [ref=e243]
            - paragraph [ref=e244]: 下周大势节点上不太清晰，总之是分歧反弹进行时。除非出现特别差的走势，再需要纠正定性。
            - paragraph [ref=e245]
            - paragraph [ref=e246]: 既然是反弹进行时，那么剩下的东西都靠主观了。
            - paragraph [ref=e247]
            - paragraph [ref=e248]: 我觉得后续的思路还是盯着两个方向，对于高位的，盯着各个方向的头部票，做抱团预期。低位的，等一些启动看一看。
            - paragraph [ref=e249]
            - paragraph [ref=e250]: 简单梳理下题材：
            - paragraph [ref=e251]
            - paragraph [ref=e252]: 短剧，仍旧是目前情绪的最强方向，但已经演绎五天，下一步赚钱效应会缩圈，集中在，个别前排辨识度的趋势预期，以及，低位的补涨首板之类的。通常，低位补涨，卡在大势反弹，或板块回流节点，会比较突出些，其他节点的容易不清晰。
            - paragraph [ref=e253]
            - paragraph [ref=e254]: 目前前排看还是，上8海电影，芒8果超媒，浙8文影业，等等。
            - paragraph [ref=e255]
            - paragraph [ref=e256]: 物理AI/机器r，不是当下的最，但里面的头部票会跟着短剧炒一些抱团预期，周末有个小催化，苹果研究团队披露机器“大脑”研究进展，单项任务测试平均成功率为91%。利好机器本体方向，以及，增量环节的触觉采集。
            - paragraph [ref=e257]
            - paragraph [ref=e258]: 目前人气股：上8纬新材，宇8树科技等，福8莱新材，福8新转债
            - paragraph [ref=e259]
            - paragraph [ref=e260]: 端侧，跟短剧节奏类似，但规模不如短剧，这个方向如还有机会，感觉也是内部的趋势的引领的，看趋势能否延续。然后，该强不强，该反包没反包，算不及预期。
            - paragraph [ref=e261]
            - paragraph [ref=e262]: 算力出海，周三节点，原本最强的是国产半导体和光伏，但感觉这两个方向都有瑕疵。国产半导体，更多是靠ETF买起来的，虽然比海外强，但未必强到哪去，没有外在力量，内驱力还是差一些，且，当下的他们并没有新的逻辑叙事，能够让人心甘情愿追高。光伏，想象力和发展性也存在些瑕疵。
            - paragraph [ref=e263]
            - paragraph [ref=e264]: 于是，这几天不知不觉变强的算力出海又被提起来了。海外限制数8据中心，间接利好我们的。
            - paragraph [ref=e265]
            - paragraph [ref=e266]: 目前人气股:润8建股份，等。
            - paragraph [ref=e267]
            - paragraph [ref=e268]: 以及，周末还发酵了太空算力，也算这个方向。（美国限制数8据中心，然后转移预期）商业航天前期跟着机器r反弹过，现在位置不上不下，有点难定性。明天来一个加强也行，合力不够变成震荡也行，总之不清晰了。
            - paragraph [ref=e269]
            - paragraph [ref=e270]: 所以，后面的情绪主要还是会依赖指数，指数如果震荡，题材显得一般，指数如果大涨，都会好看些。
            - paragraph [ref=e271]
            - paragraph [ref=e272]: 只是指数强弱需要边走边看，还要结合外盘。指数之外的主观，那就是上面这些，看是否有好的节点。
            - paragraph [ref=e273]
            - paragraph [ref=e274]: 反正明确一点：
            - paragraph [ref=e275]
            - paragraph [ref=e276]: 对于已经明牌，或者半明牌的，主要考验，信不信的分歧接力，以及，失败后的应对。
            - paragraph [ref=e277]
            - paragraph [ref=e278]: 对于不够明牌，不够清晰，就是随缘，看一看是否有启动，找找前排首板。
