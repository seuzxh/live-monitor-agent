            - paragraph [ref=e300]
            - paragraph [ref=e301]: 1，周五国常会：完善资本市场稳市机制，增强股市内在稳定性，促进资本市场平稳9健康发展。 加快重大项目和“六张网”建设实施进度，支持企业扩大设备更新、无形资产等投资。
            - paragraph [ref=e302]
            - paragraph [ref=e303]: 2，欧洲多国爆发抗议，要求暂停数9据中心建设。
            - paragraph [ref=e304]
            - paragraph [ref=e305]: 3，苹果研究团队披露机器“大脑”研究进展，单项任务测试平均成功率为91%。
            - paragraph [ref=e306]
            - paragraph [ref=e307]: 4，广电总局部署开展新一轮微短剧低俗化同质化专项治理 通过资金扶持等工作机制，不断提升微短剧的文化内涵、艺术品质和社会价值。
            - paragraph [ref=e308]
            - paragraph [ref=e309]: 5，媒体：“短剧时间”并非虚度光阴，竖屏里的中国叙事已成文化出海范式。
            - paragraph [ref=e310]
            - paragraph [ref=e311]: 6，中国9移9动公布了2027年投资计划，明确将进一步扩大采购规模，预计总金额在5000亿元以上，算力投资1000亿元以上。
            - paragraph [ref=e312]
            - paragraph [ref=e313]: 7，马斯克再抛惊人目标：明年SpaceX年化收入5000亿美元、Terafab芯片产能一太瓦、星链计算机同步上天。
            - paragraph [ref=e314]
            - paragraph [ref=e315]: 8，国家能源局：“十五五”时期 我国每年新增3个上海市用电量 新型储能2030年装机目标3亿千瓦。
            - paragraph [ref=e316]
            - paragraph [ref=e317]: 9，11月6日，马斯克首次明确了StarMind的部署时间表：2027年第三季度发射首批与英伟达联合设计的太空AI计算机，2028和2029年进行大规模部署。
